<link rel="stylesheet" id="jtd-dark" href="{{ '/assets/css/just-the-docs-dark.css' | relative_url }}" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    if (saved) document.getElementById('jtd-dark').media = saved === 'dark' ? 'all' : 'not all';
  })();
</script>
