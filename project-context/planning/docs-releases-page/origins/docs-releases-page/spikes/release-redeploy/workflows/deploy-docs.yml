name: Deploy docs
on:
  push:
    branches: [main]
    paths: [docs/**]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List releases as the build token sees them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ref=$GITHUB_REF sha=$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | {tag_name, draft, prerelease, published_at}'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
